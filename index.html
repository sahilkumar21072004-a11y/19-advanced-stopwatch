<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Stopwatch</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div class="container">
  <div class="card">

    <h1>⏱ Stopwatch</h1>

    <!-- Time Display -->
    <div id="display" class="time">00:00:000</div>

    <!-- Buttons -->
    <div class="buttons">
      <button onclick="startPause()">Start</button>
      <button onclick="lap()">Lap</button>
      <button onclick="reset()">Reset</button>
    </div>

    <!-- Lap List -->
    <ul id="laps" class="laps"></ul>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
